name: Model-free tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Thesis/sardinella-lemuru-ml
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Thesis/sardinella-lemuru-ml/requirements.txt
            Thesis/sardinella-lemuru-ml/requirements-test.txt
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3" "torchvision>=0.17,<1"
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Run all tests without checkpoint files
        run: python -B tests/run_model_free_isolated.py
