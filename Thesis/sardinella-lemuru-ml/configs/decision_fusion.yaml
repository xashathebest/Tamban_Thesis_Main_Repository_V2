# Supporting measurements become evidence only after specimen-separated,
# annotator-verified calibration and held-out validation. No ranges are invented.
enabled: true
weights:
  model2: 0.70
  size: 0.15
  cracks: 0.05
  color: 0.05
  texture: 0.05
artifact_path: configs/decision_fusion_calibration.json
# Engineering acceptance settings; the artifact must validate this exact policy.
minimum_reliability: 0.50
strong_conflict_reliability: 0.65
strong_conflict_margin: 0.35
minimum_decision_confidence: 0.55
minimum_fused_margin: 0.08
disagreement_penalty: 0.25
major_conflict_penalty: 0.50
